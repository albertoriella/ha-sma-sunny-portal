name: Validate

on:
  pull_request:
  push:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan complete history with Gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git \
            --no-banner \
            --no-color \
            --redact=100 \
            --max-decode-depth=2 \
            --log-opts='--all' \
            /repo

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run tests
        run: python -m pytest

      - name: Check frontend syntax
        run: node --check custom_components/sma_sunny_portal/frontend_assets/sma-sunny-portal-energy-card.js

      - name: Test frontend registration
        run: node tests/test_frontend_registration.mjs

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linter
        run: python -m ruff check .
